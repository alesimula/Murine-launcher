// Included so the IDE marks modules/ as a module too; it holds no build script itself.
include ':modules'

final File MODULES_DIR = new File(rootDir, 'modules')

// Folders under modules/ that are not projects themselves but hold subprojects.
final List<String> MODULE_CONTAINERS = [
        'SettingsLib'
]

def isProject = { File f ->
    f.isDirectory() && (new File(f, 'build.gradle').exists() || new File(f, 'build.gradle.kts').exists())
}

// A folder under modules/ is a project if it has a build script (or is listed as a container);
// only then are its children scanned for subprojects.
MODULES_DIR.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { File dir ->
    if (!isProject(dir) && !(dir.name in MODULE_CONTAINERS)) return
    include ":${dir.name}"
    project(":${dir.name}").projectDir = dir // set before children resolve against it
    dir.listFiles().findAll(isProject).sort { it.name }.each { include ":${dir.name}:${it.name}" }
}
