plugins {
    id 'com.android.library'
}

android {
    compileSdk = COMPILE_SDK as int
    namespace "com.android.systemui.plugin_core"

    defaultConfig {
        minSdk = 26
        targetSdk = 36
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        aidl true
    }
    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src']
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
