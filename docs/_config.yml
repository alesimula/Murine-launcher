title: r4l.launcher
description: >-
  Rafael Maciel's Android launcher with offline app categories and bottom drawer search.
url: "https://rafaeltj13.github.io"
baseurl: "/r4l.launcher"

version: "2.0.0" #Website version - increase to invalidate cached resources
github_repo: "rafaeltj13/r4l.launcher"
icon_url: "/r4l.launcher/assets/img/icon_adaptive_baked.svg"
icon_freeform_url: "/r4l.launcher/assets/img/icon_freeform_baked.svg"
screenshots_api: "https://api.github.com/repos/rafaeltj13/r4l.launcher/contents/fastlane/metadata/android/en-US/images/phoneScreenshots"
releases_api: "https://api.github.com/repos/rafaeltj13/r4l.launcher/releases"

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
