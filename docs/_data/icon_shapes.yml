# Presets on the icon shapes page (/icon-shapes/), in this order.
#
# visible: how many show in the page's grid straight away; the rest appear with "More shapes".
#          The Add a shape dialog always lists all of them.
#
# Each entry has a name and is either one shape or several, listed under `shapes`. A shape is one of:
#   box:     [top-left, top-right, bottom-right, bottom-left corner size, smoothing]
#            a rounded rectangle; smoothing is optional (default 0.5)
#   polygon: [sides, inner, angle, corner size, inner corner size, smoothing]
#            a regular polygon (inner 1) or a star (inner < 1: its inner points sit at that
#            fraction of the radius); angle turns it, in degrees. The last two are optional
#            (inner corner size defaults to the corner size, smoothing to 0.5)
#   pts:     corners in order around the shape, each [x, y, corner size, smoothing], in the
#            0-100 box (y grows down); corner size and smoothing are optional (default 0)
#   path:    a fixed outline, not editable point by point: absolute M/L/C only, single
#            spaces, closed with Z (see "Link format" on the page)
#
# Or, for an icon made in the editor, `icon` holds the editor's own data exactly as an edit
# link carries it (JSON, which is also valid YAML): {"shapes": [...]}, see "Link format" on
# the page. It's checked the same way as a link and used as stored; `fit: true` fits it to
# the box instead. If the editor's shape format changes, see the note above snapshot() in
# assets/js/shape-editor.js on keeping the readable forms here in step.
# Corner size: how far the rounding reaches along both edges. Smoothing: 0 cuts the corner
# straight, 0.5 is a circular arc, 1 is squircle-like.
#
# Any shape can also have:
#   at:      [x, y, width, height] stretches the shape onto this rectangle like an image,
#            instead of the whole 0-100 box: whatever it draws in the 0-100 box (rounding
#            included) lands in the rectangle, so a circle in a wide one becomes an ellipse.
#            In the editor it opens with that stretch (Unstretch undoes it). Mostly useful
#            with `shapes`, to place each one.
#   angle:   degrees, turns the shape clockwise (as the editor's rotation slider) after `at`,
#            around the centre of its rectangle (or of the box, without `at`). A shape
#            stretched and then turned (a diagonal stretch) is written as unturned corners,
#            `at` and `angle`.
#   mirror:  h (adds a copy mirrored left to right, across x = 50), v (top to bottom, across
#            y = 50) or both (three copies)
#
#   - name: Cloud
#     shapes:
#       - box: [20, 20, 20, 20]
#         at: [4, 48, 92, 34]
#       - box: [50, 50, 50, 50]
#         at: [24, 18, 50, 50]
#
# Fitting: a single editable shape (box, polygon, pts) is scaled and centred to fill the box,
# mirrored copies included; a single path is used as written. Several shapes are scaled and
# centred together, keeping their places relative to each other. In the editor they open as
# separate shapes, in the order listed. `fit: false` on an entry keeps everything exactly
# where it's written instead (parts may reach outside the box).
#
# whole:    the Global card's transform, applied to the merged icon without changing its shapes,
#           e.g. whole: {a: 0.9, x: 5, y: 5, ang: 30, flip: true}. In order: flip mirrors it left to
#           right, a scales, x, y move, ang turns it clockwise around the moved box's middle, st
#           stretches. rot is only the slider's reading. An `icon` entry holds it in its data instead.
#
# An entry that doesn't make a valid icon is left out: a broken shape, crossing edges, or
# shapes (and mirrored copies) that don't all touch. Squircle is the editor's default icon
# (and what Reset goes back to), so keep it.

