---
layout: default
---

<div class="page-container">
  {% if page.title %}
  <div class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
  {% endif %}

  <div class="page-body">
    {{ content }}
  </div>
</div>
