<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function(){var t=localStorage.getItem('murine-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="darkreader-lock">
  {% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Material Symbols: only the icons in use (~4 KB instead of the ~4 MB variable font). TODO Add every new icon here, list must stay alphabetical -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,android,calendar_today,chat,close,cloud_off,code,dark_mode,delete,description,download,edit,favorite,filter_center_focus,fit_screen,history,home,hourglass_top,info,light_mode,mail,new_releases,open_with,palette,policy,rotate_right,search,sell,smartphone&display=block">

  <link rel="icon" type="image/svg+xml" href="{{ site.icon_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.version }}">

  {% seo %}
</head>
<body>
  {% include nav.html %}

  <main class="main-content">
    {{ content }}
  </main>

  {% include footer.html %}
  {% include contact-modal.html %}

  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ site.version }}"></script>
  <script src="{{ '/assets/js/github-api.js' | relative_url }}?v={{ site.version }}"></script>
</body>
</html>
